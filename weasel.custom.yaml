config_version: "2026-08-14"

app_options:
  firefox.exe:
    inline_preedit: true

show_notifications: true
show_notifications_time: 1200
global_ascii: false

style:
  color_scheme: roseo_maple
  color_scheme_dark: roseo_maple_dark
  font_face: "Segoe UI Emoji, Microsoft YaHei, SF Pro, Noto Color Emoji"
  label_font_face: "Microsoft YaHei"
  comment_font_face: "Microsoft YaHei"
  font_point: 14
  label_font_point: 14
  comment_font_point: 10
  inline_preedit: true
  preedit_type: composition
  fullscreen: false
  horizontal: true
  vertical_text: false
  vertical_text_left_to_right: false
  vertical_text_with_wrap: false
  vertical_auto_reverse: false
  label_format: "%s"
  mark_text: ""
  ascii_tip_follow_cursor: false
  enhanced_position: true
  display_tray_icon: false
  antialias_mode: default
  candidate_abbreviate_length: 30
  mouse_hover_ms: 0
  hover_type: none
  paging_on_scroll: true
  click_to_capture: false
  layout:
    baseline: 0
    linespacing: 0
    align_type: center
    max_height: 600
    max_width: 0
    min_height: 0
    min_width: 10
    border_width: 0
    margin_x: 8
    margin_y: 8
    spacing: 13
    candidate_spacing: 22
    hilite_spacing: 6
    hilite_padding: 8
    shadow_radius: 0
    shadow_offset_x: 4
    shadow_offset_y: 4
    corner_radius: 8
    round_corner: 8

